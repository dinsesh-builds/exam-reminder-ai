<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Reminder</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           THEME VARIABLES - 4 MODES
           ============================================ */
        
        :root {
            /* Default: Midnight Neon */
            --bg-primary: #0a0a0f;
            --bg-secondary: #16161f;
            --bg-card: #1e1e2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-primary: #ff6b9d;
            --accent-secondary: #00d4aa;
            --accent-gradient: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            --glow: rgba(255, 107, 157, 0.15);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --border-radius: 16px;
            --shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        [data-theme="berry"] {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-card: #252525;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent-primary: #9f7aea;
            --accent-secondary: #48bb78;
            --accent-gradient: linear-gradient(135deg, #9f7aea 0%, #805ad5 100%);
            --glow: rgba(159, 122, 234, 0.15);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        [data-theme="sunset"] {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #222222;
            --text-primary: #ffffff;
            --text-secondary: #b8b8b8;
            --accent-primary: #ffaa00;
            --accent-secondary: #ff5e57;
            --accent-gradient: linear-gradient(135deg, #ffaa00 0%, #ff5e57 100%);
            --glow: rgba(255, 170, 0, 0.15);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        [data-theme="clean"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #6b6b8a;
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glow: rgba(102, 126, 234, 0.1);
            --font-heading: 'Plus Jakarta Sans', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        /* ============================================
           BASE STYLES
           ============================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        [data-theme="clean"] .card {
            border: 1px solid #e8e8f0;
        }

        .card-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        [data-theme="clean"] input[type="text"],
        [data-theme="clean"] input[type="date"] {
            background: #f8f9fa;
            border-color: #e8e8f0;
            color: #1a1a2e;
        }

        input[type="text"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--glow);
        }

        .file-input-wrapper {
            position: relative;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-secondary);
        }

        [data-theme="clean"] .file-input-wrapper {
            border-color: #d0d0e0;
            background: #f8f9fa;
        }

        .file-input-wrapper:hover {
            border-color: var(--accent-primary);
            background: var(--glow);
        }

        .file-input-wrapper.has-file {
            border-color: var(--accent-secondary);
            background: rgba(0, 212, 170, 0.1);
        }

        [data-theme="clean"] .file-input-wrapper.has-file {
            background: #f0fff4;
        }

        input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .file-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .file-name {
            color: var(--accent-secondary);
            font-weight: 600;
            margin-top: 8px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-heading);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--glow);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-small {
            width: auto;
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            border: 2px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
        }

        [data-theme="clean"] .btn-secondary {
            background: #f8f9fa;
            border-color: #e8e8f0;
            color: #1a1a2e;
        }

        /* ============================================
           THEME PICKER
           ============================================ */
        
        .theme-picker {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }

        .theme-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: var(--bg-card);
            box-shadow: var(--shadow);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
            min-width: 200px;
        }

        .theme-menu.active {
            display: block;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 6px;
        }

        .theme-option:hover {
            background: var(--bg-secondary);
        }

        .theme-option:last-child {
            margin-bottom: 0;
        }

        .theme-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .theme-dot.neon { background: linear-gradient(135deg, #ff6b9d, #00d4aa); }
        .theme-dot.berry { background: linear-gradient(135deg, #9f7aea, #48bb78); }
        .theme-dot.sunset { background: linear-gradient(135deg, #ffaa00, #ff5e57); }
        .theme-dot.clean { background: linear-gradient(135deg, #667eea, #764ba2); border: 2px solid #ddd; }

        .theme-name {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .theme-active {
            background: var(--glow);
        }

        /* ============================================
           LOADING & RESULTS
           ============================================ */
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--bg-secondary);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .countdown {
            background: var(--accent-gradient);
            color: white;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px var(--glow);
        }

        .countdown-number {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            font-weight: 700;
        }

        .countdown-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* Progress */
        .progress-bar-container {
            background: var(--bg-secondary);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 10px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        /* Questions */
        .question-card {
            background: var(--bg-secondary);
            border-left: 4px solid var(--accent-primary);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .question-card.studied {
            opacity: 0.5;
        }

        .question-card.studied .question-text {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .question-type {
            background: var(--accent-gradient);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .question-marks {
            color: var(--accent-secondary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .question-text {
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .question-why {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .question-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        [data-theme="clean"] .question-footer {
            border-top-color: #e8e8f0;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent-primary);
        }

        .checkbox-wrapper span {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .difficulty-easy { border-left-color: var(--accent-secondary) !important; }
        .difficulty-medium { border-left-color: var(--accent-primary) !important; }
        .difficulty-hard { border-left-color: #ff6b6b !important; }

        /* Schedule */
        .schedule-day {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .day-number {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .day-high { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); }
        .day-medium { background: linear-gradient(135deg, #ed8936, #dd6b20); }
        .day-low { background: linear-gradient(135deg, var(--accent-secondary), #38a169); }

        .day-content {
            flex: 1;
        }

        .day-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .day-topics {
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Misc */
        .error {
            background: rgba(245, 101, 101, 0.1);
            color: #ff6b6b;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(245, 101, 101, 0.2);
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 600;
            margin: 28px 0 14px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.05);
            color: var(--text-primary);
        }

        [data-theme="clean"] .section-title {
            border-bottom-color: #e8e8f0;
        }

        .analysis-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        [data-theme="clean"] .tag {
            background: #f8f9fa;
            border-color: #e8e8f0;
        }

        .tag-highlight {
            background: var(--accent-gradient);
            color: white;
            border: none;
        }

        @media print {
            body { background: white !important; }
            .card, .question-card, .schedule-day { 
                break-inside: avoid; 
                box-shadow: none;
                border: 1px solid #ddd;
            }
            .btn, .file-input-wrapper, .question-footer, .theme-picker { display: none; }
            .question-card.studied { display: none; }
        }
    </style>
</head>
<body data-theme="neon">
    <div class="container">
        <div class="header">
            <h1>📚 Exam Reminder</h1>
            <p>Upload your notes, get predicted questions & track your progress</p>
        </div>

        <div class="card">
            <div class="card-title">📤 Upload Notes</div>
            
            <div class="form-group">
                <label>Your Notes (PDF, Image, or Text)</label>
                <div class="file-input-wrapper" id="fileWrapper">
                    <input type="file" id="fileInput" accept=".txt,.pdf,.png,.jpg,.jpeg">
                    <div class="file-icon">📄</div>
                    <div class="file-text">Click or drag file here</div>
                    <div class="file-name" id="fileName"></div>
                </div>
            </div>

            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="subject" placeholder="e.g., Biology, Physics, Mathematics">
            </div>

            <div class="form-group">
                <label>Exam Date</label>
                <input type="date" id="examDate">
            </div>

            <button class="btn" id="analyzeBtn" onclick="analyzeNotes()">
                🚀 Analyze & Generate Questions
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: var(--text-secondary);">Analyzing your notes...</p>
        </div>

        <div class="results" id="results"></div>
    </div>

    <!-- Theme Picker -->
    <div class="theme-picker">
        <div class="theme-menu" id="themeMenu">
            <div class="theme-option theme-active" onclick="setTheme('neon')">
                <div class="theme-dot neon"></div>
                <div class="theme-name">🩷 Midnight Neon</div>
            </div>
            <div class="theme-option" onclick="setTheme('berry')">
                <div class="theme-dot berry"></div>
                <div class="theme-name">💜 Electric Berry</div>
            </div>
            <div class="theme-option" onclick="setTheme('sunset')">
                <div class="theme-dot sunset"></div>
                <div class="theme-name">🧡 Sunset Pop</div>
            </div>
            <div class="theme-option" onclick="setTheme('clean')">
                <div class="theme-dot clean"></div>
                <div class="theme-name">☀️ Clean Slate</div>
            </div>
        </div>
        <button class="theme-btn" onclick="toggleThemeMenu()">🎨</button>
    </div>

    <script>
        const API_URL = (location.protocol.startsWith('http') ? location.origin : 'http://127.0.0.1:8000') + '/analyze';
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        let currentQuestions = [];
        let currentTheme = localStorage.getItem('examTheme') || 'neon';
        
        // Apply saved theme
        document.body.setAttribute('data-theme', currentTheme);
        updateThemeActive();

        // Theme functions
        function toggleThemeMenu() {
            document.getElementById('themeMenu').classList.toggle('active');
        }

        function setTheme(theme) {
            currentTheme = theme;
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('examTheme', theme);
            updateThemeActive();
            document.getElementById('themeMenu').classList.remove('active');
        }

        function updateThemeActive() {
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.classList.remove('theme-active');
            });
            const active = document.querySelector(`[onclick="setTheme('${currentTheme}')"]`);
            if (active) active.classList.add('theme-active');
        }

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.theme-picker')) {
                document.getElementById('themeMenu').classList.remove('active');
            }
        });

        // File input
        const fileInput = document.getElementById('fileInput');
        const fileWrapper = document.getElementById('fileWrapper');
        const fileName = document.getElementById('fileName');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileWrapper.classList.add('has-file');
                fileName.textContent = e.target.files[0].name;
            }
        });

        async function analyzeNotes() {
            const file = fileInput.files[0];
            const subject = document.getElementById('subject').value || 'General';
            const examDate = document.getElementById('examDate').value;

            if (!file) {
                alert('Please select a file first!');
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            btn.disabled = true;
            loading.classList.add('active');
            results.classList.remove('active');

            const formData = new FormData();
            formData.append('file', file);
            formData.append('subject', subject);
            if (examDate) formData.append('exam_date', examDate);

            try {
                const response = await fetch(API_URL, { method: 'POST', body: formData });
                const data = await response.json();

                if (!response.ok) {
                    showError(data.detail || data.error || ('Request failed with status ' + response.status));
                } else if (data.error) {
                    showError(data.error);
                } else {
                    currentQuestions = data.questions || [];
                    showResults(data);
                }
            } catch (err) {
                showError('Could not reach the server. Start it with python app.py, then try again.');
            } finally {
                btn.disabled = false;
                loading.classList.remove('active');
            }
        }

        function showError(message) {
            const results = document.getElementById('results');
            results.innerHTML = `<div class="error">❌ ${esc(message)}</div>`;
            results.classList.add('active');
        }

        function showResults(data) {
            const results = document.getElementById('results');
            let html = '';

            // Countdown
            if (data.days_remaining !== null) {
                html += `
                    <div class="countdown">
                        <div class="countdown-number">${esc(data.days_remaining)}</div>
                        <div class="countdown-label">days until ${esc(data.subject)} exam</div>
                    </div>
                `;
            }

            // Analysis
            html += `
                <div class="card">
                    <div class="card-title">📊 Analysis Summary</div>
                    <div class="analysis-tags">
                        ${data.analysis.definitions.map(d => `<span class="tag tag-highlight">📖 ${esc(d.substring(0, 30))}</span>`).join('')}
                        ${data.analysis.comparisons.map(c => `<span class="tag">⚖️ ${esc(c)}</span>`).join('')}
                        ${data.analysis.bold_terms.map(b => `<span class="tag">⭐ ${esc(b)}</span>`).join('')}
                        ${data.analysis.formulas.map(f => `<span class="tag">🔢 ${esc(f.substring(0, 30))}</span>`).join('')}
                    </div>
                    <div style="margin-top: 12px; color: var(--text-secondary); font-size: 0.9rem;">
                        Found ${esc(data.analysis.total_words)} words | ${esc(data.analysis.top_topics.length)} key topics
                    </div>
                </div>
            `;

            // Progress
            if (data.questions && data.questions.length > 0) {
                html += `
                    <div class="card">
                        <div class="card-title">📈 Study Progress</div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" id="progressBar" style="width: 0%;">0%</div>
                        </div>
                        <div class="progress-stats">
                            <span id="studiedCount">0 studied</span>
                            <span id="totalCount">${esc(data.questions.length)} total</span>
                        </div>
                        <button class="btn btn-secondary btn-small" onclick="resetProgress()">
                            🔄 Reset Progress
                        </button>
                    </div>
                `;
            }

            // Questions
            if (data.questions && data.questions.length > 0) {
                html += `<div class="section-title">📝 Predicted Exam Questions (${esc(data.questions.length)})</div>`;

                data.questions.forEach((q, i) => {
                    const level = String(q.difficulty || '').toLowerCase();
                    const diffClass = 'difficulty-' + (['easy', 'medium', 'hard'].includes(level) ? level : 'medium');
                    html += `
                        <div class="question-card ${diffClass}" id="question-${i}" data-index="${i}">
                            <div class="question-header">
                                <span class="question-type">${esc(q.type)}</span>
                                <span class="question-marks">${esc(q.marks)} marks</span>
                            </div>
                            <div class="question-text">${i + 1}. ${esc(q.question)}</div>
                            <div class="question-why">💡 ${esc(q.why_important)}</div>
                            <div class="question-footer">
                                <label class="checkbox-wrapper">
                                    <input type="checkbox" onchange="toggleStudied(${i})" id="checkbox-${i}">
                                    <span>Mark as studied</span>
                                </label>
                            </div>
                        </div>
                    `;
                });
            }

            // Schedule
            if (data.study_schedule && data.study_schedule.length > 0) {
                html += `<div class="section-title">📅 Study Schedule</div><div class="card">`;
                
                data.study_schedule.forEach(day => {
                    const urgency = String(day.urgency || '').toLowerCase();
                    const urgencyClass = 'day-' + (['high', 'medium', 'low'].includes(urgency) ? urgency : 'low');
                    html += `
                        <div class="schedule-day">
                            <div class="day-number ${urgencyClass}">${esc(day.day)}</div>
                            <div class="day-content">
                                <div class="day-date">${esc(day.date)}</div>
                                <div class="day-topics">${esc(day.topics.join(', '))}</div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            }

            results.innerHTML = html;
            results.classList.add('active');
            loadProgress();
        }

        function toggleStudied(index) {
            const checkbox = document.getElementById(`checkbox-${index}`);
            const card = document.getElementById(`question-${index}`);
            
            if (checkbox.checked) {
                card.classList.add('studied');
            } else {
                card.classList.remove('studied');
            }
            
            saveProgress();
            updateProgressBar();
        }

        function updateProgressBar() {
            const checkboxes = document.querySelectorAll('.question-card input[type="checkbox"]');
            const checked = document.querySelectorAll('.question-card input[type="checkbox"]:checked');
            const total = checkboxes.length;
            const studied = checked.length;
            const percent = total > 0 ? Math.round((studied / total) * 100) : 0;
            
            const progressBar = document.getElementById('progressBar');
            const studiedCount = document.getElementById('studiedCount');
            
            if (progressBar) {
                progressBar.style.width = `${percent}%`;
                progressBar.textContent = `${percent}%`;
            }
            
            if (studiedCount) {
                studiedCount.textContent = `${studied} studied`;
            }
        }

        function saveProgress() {
            const checkboxes = document.querySelectorAll('.question-card input[type="checkbox"]');
            const progress = {};
            checkboxes.forEach((cb, i) => {
                progress[i] = cb.checked;
            });
            localStorage.setItem('examReminderProgress', JSON.stringify(progress));
        }

        function loadProgress() {
            const saved = localStorage.getItem('examReminderProgress');
            if (!saved) return;
            
            try {
                const progress = JSON.parse(saved);
                Object.keys(progress).forEach(index => {
                    const checkbox = document.getElementById(`checkbox-${index}`);
                    const card = document.getElementById(`question-${index}`);
                    if (checkbox && progress[index]) {
                        checkbox.checked = true;
                        if (card) card.classList.add('studied');
                    }
                });
                updateProgressBar();
            } catch (e) {
                console.error('Failed to load progress', e);
            }
        }

        function resetProgress() {
            if (!confirm('Reset all progress? This cannot be undone.')) return;
            
            localStorage.removeItem('examReminderProgress');
            const checkboxes = document.querySelectorAll('.question-card input[type="checkbox"]');
            checkboxes.forEach((cb, i) => {
                cb.checked = false;
                const card = document.getElementById(`question-${i}`);
                if (card) card.classList.remove('studied');
            });
            updateProgressBar();
        }
    </script>
</body>
</html>
