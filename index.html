<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Reminder</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
:root {
  --bg: #f7f6f4;
  --surface: #ffffff;
  --surface-2: #f1efec;
  --text: #20201e;
  --muted: #625f5a;
  --border: #dedbd5;
  --accent: #1a5f8a;
  --accent-soft: #e6f0f6;
  --good: #2f6f4e;
  --warn: #9a5a12;
  --shadow: 0 1px 2px rgba(30, 25, 20, .05), 0 8px 24px rgba(30, 25, 20, .05);
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
}
body[data-theme="ink"] {
  --bg: #101416;
  --surface: #171d1f;
  --surface-2: #1e2628;
  --text: #e7ecee;
  --muted: #9aa7ab;
  --border: #2c383b;
  --accent: #83bfdd;
  --accent-soft: #1b303b;
  --good: #7fbe97;
  --warn: #dfa763;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 26px rgba(0, 0, 0, .3);
}
body[data-theme="slate"] {
  --bg: #eef1f3;
  --surface: #ffffff;
  --surface-2: #e4e9ec;
  --text: #1c2529;
  --muted: #5d6b71;
  --border: #ccd5da;
  --accent: #375f6b;
  --accent-soft: #dfeaee;
  --good: #2d6d4c;
  --warn: #945915;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); color: var(--surface); display: grid; place-items: center; font: 700 13px var(--mono); }
.theme-picker { position: relative; margin-left: auto; }
.theme-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px; padding: 6px 12px; font-size: 13px; }
.theme-btn:hover { background: var(--surface-2); }
.theme-menu {
  display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 5;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: var(--shadow); padding: 5px; min-width: 130px;
}
.theme-menu.active { display: grid; }
.theme-option { border: 0; background: transparent; color: var(--text); text-align: left; padding: 8px 10px; border-radius: 5px; font-size: 13px; }
.theme-option:hover { background: var(--surface-2); }
.theme-option.theme-active { color: var(--accent); background: var(--accent-soft); }
.container { max-width: 840px; margin: 0 auto; padding: 34px 24px 64px; }
.header { margin-bottom: 26px; }
.header h1 { font-size: 28px; line-height: 1.25; letter-spacing: -.02em; margin: 0 0 8px; font-weight: 650; }
.header p { margin: 0; color: var(--muted); max-width: 62ch; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px; box-shadow: var(--shadow); margin-bottom: 18px; }
.card-title { font-size: 13px; font-weight: 600; margin-bottom: 16px; letter-spacing: .01em; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
.form-group input[type="text"], .form-group input[type="date"] {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface); color: var(--text);
}
.file-input-wrapper {
  border: 1px dashed var(--border); border-radius: 8px; padding: 26px 16px;
  text-align: center; background: var(--surface-2); cursor: pointer;
}
.file-input-wrapper.has-file { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.file-input-wrapper input { display: block; margin: 0 auto 10px; max-width: 100%; }
.file-text { font-size: 13px; color: var(--muted); }
.file-name { font: 12px var(--mono); color: var(--accent); margin-top: 6px; word-break: break-all; }
.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
  border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: 550;
}
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn-small { padding: 7px 11px; font-size: 12px; }
.loading { display: none; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.loading.active { display: flex; }
.spinner { width: 15px; height: 15px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.results { display: none; }
.results.active { display: block; }
.error { padding: 12px 14px; border: 1px solid var(--warn); border-radius: 8px; color: var(--warn); background: var(--surface); }
.countdown { display: flex; align-items: baseline; gap: 12px; padding: 14px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.countdown-number { font: 600 34px/1 var(--mono); color: var(--accent); }
.countdown-label { color: var(--muted); font-size: 13px; }
.analysis-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 4px 8px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
.tag-highlight { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.progress-bar-container { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--accent); transition: width .18s ease; }
.progress-stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 8px 0 14px; }
.section-title { font-size: 15px; font-weight: 600; margin: 26px 0 12px; }
.question-card { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 7px; padding: 15px 16px; margin-bottom: 10px; background: var(--surface); }
.question-card.difficulty-medium { border-left-color: var(--warn); }
.question-card.difficulty-hard { border-left-color: var(--text); }
.question-header { display: flex; gap: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.question-marks { margin-left: auto; }
.question-text { margin: 10px 0 6px; font-size: 15px; }
.question-why { font-size: 12px; color: var(--muted); }
.question-bloom { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
.question-answer { font-size: 12px; color: var(--good); margin-top: 7px; }
.question-source { font-size: 11px; color: var(--accent); margin-top: 4px; }
.question-card.studied { opacity: .55; }
.question-footer { margin-top: 12px; }
.checkbox-wrapper { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; }
.schedule-day { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.schedule-day:last-child { border-bottom: 0; }
.day-number { width: 26px; height: 26px; border-radius: 5px; background: var(--surface-2); display: grid; place-items: center; font: 12px var(--mono); color: var(--muted); }
.day-number.day-high { color: var(--warn); background: var(--surface-2); }
.day-date { font: 12px var(--mono); color: var(--muted); }
.day-topics { font-size: 13px; margin-top: 3px; }
.actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.note { font-size: 12px; color: var(--muted); margin-top: 14px; }
@media (max-width: 640px) {
  .topbar { padding: 12px 16px; }
  .container { padding: 24px 16px 48px; }
  .header h1 { font-size: 24px; }
  .card { padding: 16px; }
}
@media print {
  :root, body[data-theme] { --bg: #fff; --surface: #fff; --text: #000; --muted: #333; --border: #bbb; --accent: #000; --surface-2: #fff; }
  body { background: #fff; color: #000; font-size: 12px; }
  .topbar, .theme-picker, .actions, .btn, .progress-stats, .checkbox-wrapper, .loading, .note { display: none !important; }
  .container { max-width: none; padding: 0; }
  .card { border: 0; box-shadow: none; padding: 0; margin: 0 0 12px; }
  .question-card { break-inside: avoid; border: 0; border-bottom: 1px solid #999; padding: 8px 0; }
  .question-card.studied { opacity: 1; }
  .section-title { margin: 14px 0 8px; }
  .results { display: block !important; }
  .countdown { border-bottom: 1px solid #999; }
  a { color: #000; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
    </style>
</head>
<body data-theme="neon">
<header class="topbar">
  <div class="brand"><span class="brand-mark">?</span><span>Exam Reminder</span></div>
  <div class="theme-picker">
    <button class="theme-btn" type="button" onclick="toggleThemeMenu()" aria-expanded="false" aria-label="Choose theme">Theme</button>
    <div class="theme-menu" id="themeMenu">
      <button class="theme-option" type="button" onclick="setTheme('paper')">Paper</button>
      <button class="theme-option" type="button" onclick="setTheme('ink')">Ink</button>
      <button class="theme-option" type="button" onclick="setTheme('slate')">Slate</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="header">
    <h1>Practice questions from your notes</h1>
    <p>Upload a PDF, image or text file. Question generation runs on this machine and needs no account or API key. Review the questions before you use them.</p>
  </div>

  <section class="card">
    <div class="card-title">Your material</div>
    <div class="form-group">
      <label for="fileInput">Notes file</label>
      <div class="file-input-wrapper" id="fileWrapper">
        <input type="file" id="fileInput" accept=".txt,.pdf,.png,.jpg,.jpeg">
        <div class="file-text">Choose a PDF, image or text file</div>
        <div class="file-name" id="fileName"></div>
      </div>
    </div>
    <div class="form-group">
      <label for="subject">Subject</label>
      <input type="text" id="subject" placeholder="Biology, Physics, History">
    </div>
    <div class="form-group">
      <label for="examDate">Exam date</label>
      <input type="date" id="examDate">
    </div>
    <button class="btn" id="analyzeBtn" type="button" onclick="analyzeNotes()">Generate questions</button>
  </section>

  <div class="loading" id="loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <span>Reading your notes</span>
  </div>

  <section class="results" id="results" aria-live="polite"></section>
</div>

    <script>
        const API_URL = (location.protocol.startsWith('http') ? location.origin : 'http://127.0.0.1:8000') + '/analyze';
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        let currentQuestions = [];
        let currentTheme = localStorage.getItem('examTheme') || 'paper';
        
        // Apply saved theme
        document.body.setAttribute('data-theme', currentTheme);
        updateThemeActive();

        // Theme functions
        function toggleThemeMenu() {
            const menu = document.getElementById('themeMenu');
            const open = menu.classList.toggle('active');
            document.querySelector('.theme-btn').setAttribute('aria-expanded', String(open));
        }

        function setTheme(theme) {
            currentTheme = theme;
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('examTheme', theme);
            updateThemeActive();
            document.getElementById('themeMenu').classList.remove('active');
            document.querySelector('.theme-btn').setAttribute('aria-expanded', 'false');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') setTheme(currentTheme);
        });

        function updateThemeActive() {
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.classList.remove('theme-active');
            });
            const active = document.querySelector(`[onclick="setTheme('${currentTheme}')"]`);
            if (active) active.classList.add('theme-active');
        }

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!(e.target instanceof Element) || !e.target.closest('.theme-picker')) {
                document.getElementById('themeMenu').classList.remove('active');
            }
        });

        // File input
        const fileInput = document.getElementById('fileInput');
        const fileWrapper = document.getElementById('fileWrapper');
        const fileName = document.getElementById('fileName');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileWrapper.classList.add('has-file');
                fileName.textContent = e.target.files[0].name;
            }
        });

        async function analyzeNotes() {
            const file = fileInput.files[0];
            const subject = document.getElementById('subject').value || 'General';
            const examDate = document.getElementById('examDate').value;

            if (!file) {
                showError('Choose a notes file first, then generate again.');
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            btn.disabled = true;
            loading.classList.add('active');
            results.classList.remove('active');

            const formData = new FormData();
            formData.append('file', file);
            formData.append('subject', subject);
            if (examDate) formData.append('exam_date', examDate);

            try {
                const response = await fetch(API_URL, { method: 'POST', body: formData });
                const data = await response.json();

                if (!response.ok) {
                    showError(data.detail || data.error || ('Request failed with status ' + response.status));
                } else if (data.error) {
                    showError(data.error);
                } else {
                    currentQuestions = data.questions || [];
                    showResults(data);
                }
            } catch (err) {
                showError('Could not reach the server. Start it with python app.py, then try again.');
            } finally {
                btn.disabled = false;
                loading.classList.remove('active');
            }
        }

        function showError(message) {
            const results = document.getElementById('results');
            results.innerHTML = `<div class="error">❌ ${esc(message)}</div>`;
            results.classList.add('active');
        }

        function showResults(data) {
            const results = document.getElementById('results');
            let html = '';

            // Countdown
            if (data.days_remaining !== null) {
                html += `
                    <div class="countdown">
                        <div class="countdown-number">${esc(data.days_remaining)}</div>
                        <div class="countdown-label">days until ${esc(data.subject)} exam</div>
                    </div>
                `;
            }

            // Analysis
            html += `
                <div class="card">
                    <div class="card-title">📊 Analysis Summary</div>
                    <div class="analysis-tags">
                        ${data.analysis.definitions.map(d => `<span class="tag tag-highlight">📖 ${esc(d.substring(0, 30))}</span>`).join('')}
                        ${data.analysis.comparisons.map(c => `<span class="tag">⚖️ ${esc(c)}</span>`).join('')}
                        ${data.analysis.bold_terms.map(b => `<span class="tag">⭐ ${esc(b)}</span>`).join('')}
                        ${data.analysis.formulas.map(f => `<span class="tag">🔢 ${esc(f.substring(0, 30))}</span>`).join('')}
                    </div>
                    <div style="margin-top: 12px; color: var(--text-secondary); font-size: 0.9rem;">
                        Found ${esc(data.analysis.total_words)} words | ${esc(data.analysis.top_topics.length)} key topics
                    </div>
                </div>
            `;

            // Progress
            if (data.questions && data.questions.length > 0) {
                html += `
                    <div class="card">
                        <div class="card-title">📈 Study Progress</div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" id="progressBar" style="width: 0%;">0%</div>
                        </div>
                        <div class="progress-stats">
                            <span id="studiedCount">0 studied</span>
                            <span id="totalCount">${esc(data.questions.length)} total</span>
                        </div>
                        <button class="btn btn-secondary btn-small" onclick="resetProgress()">
                            🔄 Reset Progress
                        </button>
                    </div>
                `;
            }

            // Questions
            if (data.questions && data.questions.length > 0) {
                html += `<div class="section-title">📝 Predicted Exam Questions (${esc(data.questions.length)})</div>`;

                data.questions.forEach((q, i) => {
                    const level = String(q.difficulty || '').toLowerCase();
                    const diffClass = 'difficulty-' + (['easy', 'medium', 'hard'].includes(level) ? level : 'medium');
                    html += `
                        <div class="question-card ${diffClass}" id="question-${i}" data-index="${i}">
                            <div class="question-header">
                                <span class="question-type">${esc(q.type)}</span>
                                <span class="question-marks">${esc(q.marks)} marks</span>
                            </div>
                            <div class="question-text">${i + 1}. ${esc(q.question)}</div>
                            <div class="question-why">${esc(q.why_important)} <span class="question-bloom">${esc(q.bloom || '')}</span></div>
                            <div class="question-answer">Answer in notes: ${esc(q.answer || '')}</div>
                            <div class="question-source">Source phrase: ${esc(q.source || q.topic || '')}</div>
                            <div class="question-footer">
                                <label class="checkbox-wrapper">
                                    <input type="checkbox" onchange="toggleStudied(${i})" id="checkbox-${i}">
                                    <span>Mark as studied</span>
                                </label>
                            </div>
                        </div>
                    `;
                });
            }

            // Schedule
            if (data.study_schedule && data.study_schedule.length > 0) {
                html += `<div class="section-title">📅 Study Schedule</div><div class="card">`;
                
                data.study_schedule.forEach(day => {
                    const urgency = String(day.urgency || '').toLowerCase();
                    const urgencyClass = 'day-' + (['high', 'medium', 'low'].includes(urgency) ? urgency : 'low');
                    html += `
                        <div class="schedule-day">
                            <div class="day-number ${urgencyClass}">${esc(day.day)}</div>
                            <div class="day-content">
                                <div class="day-date">${esc(day.date)}</div>
                                <div class="day-topics">${esc(day.topics.join(', '))}</div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            }

            html += `
                <div class="actions">
                    <button class="btn btn-small" type="button" onclick="copyQuestions()">Copy questions</button>
                    <button class="btn btn-secondary btn-small" type="button" onclick="exportAnkiTsv()">Export for Anki</button>
                    <button class="btn btn-secondary btn-small" type="button" onclick="window.print()">Print or save as PDF</button>
                </div>
                <p class="note">These are drafts generated from patterns in your notes. Check each question against the source before an exam.</p>
            `;
            results.innerHTML = html;
            results.classList.add('active');
            loadProgress();
        }

        function toggleStudied(index) {
            const checkbox = document.getElementById(`checkbox-${index}`);
            const card = document.getElementById(`question-${index}`);
            
            if (checkbox.checked) {
                card.classList.add('studied');
            } else {
                card.classList.remove('studied');
            }
            
            saveProgress();
            updateProgressBar();
        }

        function updateProgressBar() {
            const checkboxes = document.querySelectorAll('.question-card input[type="checkbox"]');
            const checked = document.querySelectorAll('.question-card input[type="checkbox"]:checked');
            const total = checkboxes.length;
            const studied = checked.length;
            const percent = total > 0 ? Math.round((studied / total) * 100) : 0;
            
            const progressBar = document.getElementById('progressBar');
            const studiedCount = document.getElementById('studiedCount');
            
            if (progressBar) {
                progressBar.style.width = `${percent}%`;
                progressBar.textContent = `${percent}%`;
            }
            
            if (studiedCount) {
                studiedCount.textContent = `${studied} studied`;
            }
        }

        function saveProgress() {
            const checkboxes = document.querySelectorAll('.question-card input[type="checkbox"]');
            const progress = {};
            checkboxes.forEach((cb, i) => {
                progress[i] = cb.checked;
            });
            localStorage.setItem('examReminderProgress', JSON.stringify(progress));
        }

        function loadProgress() {
            const saved = localStorage.getItem('examReminderProgress');
            if (!saved) return;
            
            try {
                const progress = JSON.parse(saved);
                Object.keys(progress).forEach(index => {
                    const checkbox = document.getElementById(`checkbox-${index}`);
                    const card = document.getElementById(`question-${index}`);
                    if (checkbox && progress[index]) {
                        checkbox.checked = true;
                        if (card) card.classList.add('studied');
                    }
                });
                updateProgressBar();
            } catch (e) {
                console.error('Failed to load progress', e);
            }
        }

        function resetProgress() {
            if (!confirm('Reset all progress? This cannot be undone.')) return;
            
            localStorage.removeItem('examReminderProgress');
            const checkboxes = document.querySelectorAll('.question-card input[type="checkbox"]');
            checkboxes.forEach((cb, i) => {
                cb.checked = false;
                const card = document.getElementById(`question-${i}`);
                if (card) card.classList.remove('studied');
            });
            updateProgressBar();
        }
    </script>

    <script>
        function exportAnkiTsv() {
            const rows = currentQuestions.map(q => [
                (q.question || '').replace(/\t/g, ' '),
                (q.answer || '').replace(/\t/g, ' '),
                (q.source || q.topic || '').replace(/\t/g, ' ')
            ].join('\t'));
            if (!rows.length) return;
            const blob = new Blob([rows.join('\n')], { type: 'text/tab-separated-values;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'exam-questions.tsv';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function copyQuestions() {
            const lines = currentQuestions.map((q, i) =>
                `${i + 1}. ${q.question} [${q.difficulty}, ${q.marks} marks]\n   From your notes: ${q.source || q.topic || ''}`
            );
            const text = lines.join('\n\n');
            if (!text) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    const b = document.querySelector('[onclick="copyQuestions()"]');
                    if (b) { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy questions'; }, 1400); }
                });
            } else {
                const ta = document.createElement('textarea');
                ta.value = text; document.body.appendChild(ta); ta.select();
                document.execCommand('copy'); ta.remove();
            }
        }
    </script>
</body>
</html>
